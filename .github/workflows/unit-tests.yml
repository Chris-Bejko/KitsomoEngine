name: Unit Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Build and Run Unit Tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DECSEngine_ENABLE_RUNTIME=OFF

      - name: Build unit tests
        run: cmake --build build --config Debug --target ECSEngineUnitTests

      - name: Run unit tests
        run: ctest --test-dir build -C Debug --output-on-failure